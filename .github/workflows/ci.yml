name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - cursor/rebrand-hapshere

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Expo app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Align Expo SDK patch versions
        if: github.event_name == 'push'
        run: npx expo install --fix

      - name: Save aligned dependency files
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: expo-sdk-57-dependencies
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 1

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Check Expo project health
        run: npx expo-doctor
